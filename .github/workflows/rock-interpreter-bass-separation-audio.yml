name: Rock Interpreter Bass Separation A-B Exact Original MIDI (No Deploy)
on:
  push:
    branches:
      - rock-interpreter-bass-separation-20261008
    paths:
      - .github/workflows/rock-interpreter-bass-separation-audio.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rock-original-bass-vs-two-quiet-mix-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exactly the saved MMA original MIDI from the user-liked real recording (no new composition)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/original_mma_midi_reference
          gh run download 37870594722 --repo "${{ github.repository }}" --name official-mma-16bar-rock-arranger-to-original-recorded-instruments-r1-20261008 --dir research/original_mma_midi_reference
          echo "7253c3715299018dc540bdbaf29883bfbd7615ab7e5d943bde45f8d1b19555fe  research/original_mma_midi_reference/MMA_Rock_16Bar_Two_Sections.mid" | sha256sum -c -
      - name: Install separate external MIDI reader
        run: python -m pip install --disable-pip-version-check mido
      - name: Build original real sample instruments and the untouched 3D mixer
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          AI_COMP_ROCK_MELODY_V1: '0'
          AI_COMP_ROCK_BASS_SUSTAIN_V1: '0'
          AI_COMP_AUTO_PHRASING_V1: '0'
        run: bash build_current_composer.sh
      - name: Recreate the saved original MMA Rock interpretation from its checksum-pinned MIDI (without recomposition)
        env:
          PYTHONPATH: composer/runtime
          AI_COMP_MMA_PRESERVED_MIDI: research/original_mma_midi_reference/MMA_Rock_16Bar_Two_Sections.mid
        run: python research/mma_rock_band_handoff_16bar_r1.py
      - name: Keep every note and stem identical; reduce only original recorded electric bass in copied mixer jobs
        env:
          PYTHONPATH: composer/runtime
        run: python research/rock_mma_bass_only_balance_audition_r1.py
      - name: Archive original and true stereo two variants with source-identity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-interpreter-bass-only-reduced-4-and-8db-recorded-20261008
          path: |
            research/mma_rock_handoff_r1_output/MMA_Rock_16Bar_Interpreted_Band_Fill_3D.wav
            research/rock_bass_separation_r1_output/Rock_Interpreter_Bass_Reduced_4dB.wav
            research/rock_bass_separation_r1_output/Rock_Interpreter_Bass_Reduced_8dB.wav
            research/rock_bass_separation_r1_output/ROCK_BASS_ONLY_AB_VERIFICATION.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 21
