name: Jazz Eight Styles Parallel Checks (No Deploy)
on:
  push:
    branches: [rock-sfz-preflight-isolated-20261010]
    paths:
      - .github/workflows/jazz-parallel-eight-style-gates-20261010.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parallel-jazz:
    strategy:
      fail-fast: false
      matrix:
        genre: ["Swing", "Jazz Ballad", "Big Band", "Jazz Waltz", "Bebop", "Cool Jazz", "Dixieland", "Jazz Fusion"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify this Jazz style's symbolic score and original binding gates
        env:
          JAZZ_GENRE: ${{ matrix.genre }}
        run: |
          PYTHONPATH=composer_overrides:composer/runtime python - <<'PY'
          import os,json
          from pathlib import Path
          from genre_styles.source_pattern_library import compile_original_source_seed
          name=os.environ['JAZZ_GENRE']
          plan=compile_original_source_seed(name)
          root=Path('composer_overrides/genre_styles/Jazz')
          bind=json.loads((root/'SOURCE_RESOURCE_BINDINGS_R1.json').read_text())
          row=next(x for x in bind['genres'] if x['genre']==name)
          bindings=row['role_bindings']
          missing=[{'role':k,'instrument':v['original_instrument_id']} for k,v in bindings.items() if v.get('lookup_policy')!='EXACT_ID']
          result={'genre':name,'symbolic_events':len(plan['symbolic_note_events']),'source_roles':len(bindings),'unresolved_original_sources':missing,'full_audio_rendered_by_this_job':False,'production_unchanged':True}
          dest=Path('jazz-parallel')/name.replace(' ','_');dest.mkdir(parents=True,exist_ok=True)
          (dest/'report.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jazz-style-${{ matrix.genre }}
          path: jazz-parallel/
