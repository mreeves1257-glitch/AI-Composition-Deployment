name: Swing Original Composer Source and Instrument Audit
on:
  push:
    branches: [connect-swing-original-recorded-jazz-20261010]
    paths:
      - .github/workflows/inspect-original-swing-composer-20261010.yml
      - research/inspect_actual_swing_normal_composer_20261010.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-real-swing-before-instrument-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build original Composer and existing recorded source resources
        env:
          AI_COMP_AUTO_PHRASING_V1: '0'
        run: bash build_current_composer.sh
      - name: Inspect REAL Swing Stage-4 roles, note events, instrument source identities
        run: PYTHONPATH=composer/runtime python research/inspect_actual_swing_normal_composer_20261010.py
