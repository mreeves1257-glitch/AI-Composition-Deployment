name: All 55 Original Genre Settings and MIDI Connections Active
on:
  push:
    branches: [configure-activate-all55-genre-routing-20261010]
    paths:
      - .github/workflows/verify-all55-active-genre-settings-20261010.yml
      - composer_overrides/genre_styles/**/RUN_CONNECTION_SETTINGS_R1.json
      - composer_overrides/genre_styles/genre_run_settings.py
      - research/verify_all55_active_original_genre_settings_20261010.py
      - build_current_composer.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure-route-original-55:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use existing original MIDI transport
        run: python -m pip install mido==1.3.3
      - name: Exercise all 55 individual genre settings and actual MIDI inlets
        run: python research/verify_all55_active_original_genre_settings_20261010.py
      - name: Preserve complete per-genre readiness and instrument mapping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALL_55_GENRE_CONFIGURATION_AND_AUDIO_GATES_20261010
          path: research_artifacts/55_GENRE_RUN_CONFIGURATION.json
          if-no-files-found: warn
          retention-days: 30
