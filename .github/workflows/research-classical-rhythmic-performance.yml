name: Research Classical Rhythmic Performance Listening

on:
  push:
    branches:
      - genre-contract-v3-research
    paths:
      - "genre_contract_v3_research/render_classical_rhythmic_performance.py"
      - "genre_contract_v3_research/classical_melody_grammar_binding_validation.py"
      - "genre_contract_v3_research/classical_voice_leading_validation.py"
      - ".github/workflows/research-classical-rhythmic-performance.yml"
  workflow_dispatch:

jobs:
  render-classical-rhythmic-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supply pinned Python dependencies
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path
          root = Path("connected_package")
          manifest = json.loads((root / "manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = base64.b64decode((root / part["name"]).read_text(), validate=True)
              assert hashlib.sha256(data).hexdigest() == part["sha256"]
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == manifest["archive_sha256"]
          dest = Path("composer/runtime")
          dest.mkdir(parents=True, exist_ok=True)
          tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz").extractall(dest, filter="data")
          print("REQUIREMENTS_EXTRACTED")
          PY
          python -m pip install -r composer/runtime/enhancer_requirements.txt

      - name: Build preserved Composer runtime and audio dependencies
        run: bash build_current_composer.sh

      - name: Install MP3 converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Re-run composition binding regression
        run: |
          python -m unittest genre_contract_v3_research/test_classical_melody_grammar_binding_validation.py -v

      - name: Render rhythmic Classical listening gate
        env:
          PYTHONPATH: ${{ github.workspace }}/genre_contract_v3_research:${{ github.workspace }}/composer/runtime
          LD_LIBRARY_PATH: ${{ github.workspace }}/composer/runtime/runtime_linux/lib
          AI_COMP_FLUIDSYNTH_LIBRARY: ${{ github.workspace }}/composer/runtime/runtime_linux/lib/libfluidsynth.so.3
          CLASSICAL_RHYTHMIC_OUT: listening/classical_rhythmic_performance
          CLASSICAL_RHYTHMIC_SEED: "0"
        run: |
          python genre_contract_v3_research/render_classical_rhythmic_performance.py
          test -s listening/classical_rhythmic_performance/Classical_Period_Rhythmic_Performance.mp3
          test -s listening/classical_rhythmic_performance/validation_summary.json
          cat listening/classical_rhythmic_performance/validation_summary.json

      - name: Upload rhythmic listening package
        uses: actions/upload-artifact@v4
        with:
          name: Classical_Rhythmic_Performance_Listening
          path: |
            listening/classical_rhythmic_performance/*.mp3
            listening/classical_rhythmic_performance/*.json
            listening/classical_rhythmic_performance/*.mid
          if-no-files-found: error
          compression-level: 0
