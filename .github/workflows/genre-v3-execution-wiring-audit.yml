name: Genre V3 Execution Wiring Audit

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - "genre_contract_v3_research/GENRE_CONTRACT_V3_ALL_55.json"
      - "genre_contract_v3_research/verify_v3_execution_wiring.py"
      - "genre_contract_v3_research/verify_v3_structured_pre_generation.py"
      - "genre_contract_v3_research/verify_v3_source_pattern_bridge.py"
      - "current_master_forward/genre_contract_v3_execution_bridge.py"
      - "current_master_forward/genre_v3_instrument_authority.py"
      - "current_master_forward/classical_v3_variant_package.py"
      - "current_master_forward/genre_selector.py"
      - "current_master_forward/genre_pre_generation_compiler.py"
      - "current_master_forward/genre_v3_source_pattern_bridge.py"
      - "current_master_forward/engine.py"
      - "current_master_forward/AI_Comp_Genre_Execution_Adapter_002_WORKING_2026-10-02_184019_CDT.py"
      - "current_master_forward/classical_composition.py"
      - "current_master_forward/genre_communication_blueprint.py"
      - "current_master_forward/genre_v3_symbolic_pattern_executor.py"
      - "genre_contract_v3_research/verify_v3_symbolic_pattern_execution.py"
      - "composer_overrides/genre_styles/*/SOURCE_PATTERN_LIBRARY_R1.json"
      - ".github/workflows/genre-v3-execution-wiring-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit all 55 V3 handoffs without note or audio generation
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_v3_execution_wiring.py
          test -s genre_contract_v3_research/V3_EXECUTION_WIRING_AUDIT.json

      - name: Audit structured V3 pre-generation for all 55
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_v3_structured_pre_generation.py
          test -s genre_contract_v3_research/V3_STRUCTURED_PREGEN_AUDIT.json

      - name: Audit all 55 V3-compatible symbolic source patterns
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_v3_source_pattern_bridge.py
          test -s genre_contract_v3_research/V3_SOURCE_PATTERN_COMPATIBILITY_AUDIT.json

      - name: Audit V3 symbolic pattern execution
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_v3_symbolic_pattern_execution.py
          test -s genre_contract_v3_research/V3_SYMBOLIC_PATTERN_EXECUTION_AUDIT.json

      - name: Upload wiring audits
        uses: actions/upload-artifact@v4
        with:
          name: Genre_V3_Execution_Wiring_Audit
          path: |
            genre_contract_v3_research/V3_EXECUTION_WIRING_AUDIT.json
            genre_contract_v3_research/V3_STRUCTURED_PREGEN_AUDIT.json
            genre_contract_v3_research/V3_SOURCE_PATTERN_COMPATIBILITY_AUDIT.json
            genre_contract_v3_research/V3_SYMBOLIC_PATTERN_EXECUTION_AUDIT.json
          if-no-files-found: error
