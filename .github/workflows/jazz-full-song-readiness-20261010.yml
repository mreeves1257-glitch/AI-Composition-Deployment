name: Jazz Full Song Readiness All Styles (No Deploy)
on:
  push:
    branches: [rock-sfz-preflight-isolated-20261010]
    paths:
      - research/jazz_full_song_readiness_parallel_20261010.py
      - .github/workflows/jazz-full-song-readiness-20261010.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/jazz_full_song_readiness_parallel_20261010.py
      - uses: actions/upload-artifact@v4
        with:
          name: jazz-full-song-readiness-all-eight
          path: jazz-full-song-readiness/
