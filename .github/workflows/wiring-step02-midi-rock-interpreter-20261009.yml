name: Wiring Step 02 - MIDI to Rock's Own Interpreter (No Deploy)
on:
  push:
    branches: [wiring-step02-midi-rock-interpreter-20261009]
    paths:
      - composer_overrides/genre_styles/Rock/rock_midi_interpreter.py
      - composer_overrides/genre_styles/Rock/INTERPRETER_ROCK_R1.json
      - research/verify_midi_to_rock_interpreter_wiring_step02_20261009.py
      - .github/workflows/wiring-step02-midi-rock-interpreter-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-rock-genre-specific-midi-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MIDI reader (not a renderer or shared interpreter)
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Composer -> real multitrack MIDI -> Rock's own genre receiver
        run: python research/verify_midi_to_rock_interpreter_wiring_step02_20261009.py
      - name: Guard seven-stage boundaries and do not reactivate shared interpreter
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('composer_overrides/genre_styles/Rock/rock_midi_interpreter.py').read_text()
          assert 'shared_interpreter_router' not in s
          assert 'shared_musical_grammar' not in s
          assert 'standalone_3d_mixer' not in s
          assert 'render_midi(' not in s
          assert 'production_enabled' in s
          print("ROCK_OWN_INTERPRETER_ONLY_NO_AUDIO_NO_DEPLOY_PASS")
          PY
