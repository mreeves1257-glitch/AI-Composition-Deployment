name: Rock V3 Bass Upbeat Pitch Analysis

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-v3-bass-upbeat-pitch-analysis.yml"
      - "genre_contract_v3_research/analyze_rock_v3_bass_upbeat_pitch_changes.py"
      - "current_master_forward/rock_v3_strum_candidate_executor.py"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analyze upbeat pitch changes
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/analyze_rock_v3_bass_upbeat_pitch_changes.py
          test -s genre_contract_v3_research/ROCK_V3_BASS_UPBEAT_PITCH_ANALYSIS.json

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Rock_V3_Bass_Upbeat_Pitch_Analysis
          path: genre_contract_v3_research/ROCK_V3_BASS_UPBEAT_PITCH_ANALYSIS.json
          if-no-files-found: error
