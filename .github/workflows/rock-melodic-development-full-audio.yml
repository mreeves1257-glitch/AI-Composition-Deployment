name: Rock Real Melodic Composition Full-Song A-B Research
on:
  push:
    branches:
      - rock-composition-research-20261008
    paths:
      - .github/workflows/rock-melodic-development-full-audio.yml
      - composer_overrides/rock_melodic_development_v1.py
      - composer_overrides/test_rock_melodic_development_v1.py
      - composer_overrides/genre_development_patch.py
      - research/render_full_rock_melody_v1.py
      - build_current_composer.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-real-instruments-melody-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild existing Composer and real SFZ banks (all new composition rules OFF by default)
        env:
          AI_COMP_ROCK_MELODY_V1: '0'
          AI_COMP_ROCK_BASS_SUSTAIN_V1: '0'
          AI_COMP_AUTO_PHRASING_V1: '0'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: bash build_current_composer.sh
      - name: Compare canonical 127-bar score with Rock melody candidate then render real complete 3D stereo song
        env:
          PYTHONPATH: composer/runtime
          AI_COMP_ROCK_BASS_SUSTAIN_V1: '0'
          AI_COMP_AUTO_PHRASING_V1: '0'
        run: python research/render_full_rock_melody_v1.py
      - name: Preserve actual full-song recording and score evidence, whether successful or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-composition-r1-full-recorded-song-20261008
          path: |
            research/rock_melody_v1_full_song/ROCK_FULL_SONG_MELODY_R1_RECORDED_3D.wav
            research/rock_melody_v1_full_song/REPORT.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 21
