name: Two Real Fresh Rock Songs through SFZ and Stereo - No Deploy
on:
  push:
    branches: [verify-fresh-songs-real-stereo-20261009]
    paths:
      - build_current_composer.sh
      - composer_overrides/enable_fresh_song_seed.py
      - composer_overrides/direct_stereo_output.py
      - research/verify_two_distinct_full_rock_stereo_songs_20261009.py
      - .github/workflows/verify-two-fresh-full-rock-stereo-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce-two-genuinely-different-complete-audio-recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Composer freshness for both ordinary and test requests
        run: python research/test_composer_fresh_song_defaults_20261009.py
      - name: Check plain stereo output preserves source tracks
        run: |
          python -m pip install --disable-pip-version-check numpy
          python research/verify_direct_stereo_no_3d_20261009.py
      - name: Build ORIGINAL Composer with existing recorded SFZ banks and new-song fix
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          AI_COMP_AUTO_PHRASING_V1: '0'
          AI_COMP_ROCK_BASS_SUSTAIN_V1: '0'
          AI_COMP_ROCK_MELODY_V1: '0'
        run: bash build_current_composer.sh
      - name: Create first FULL rock song with real instruments and no 3D
        env:
          PYTHONPATH: composer/runtime
        run: python research/verify_two_distinct_full_rock_stereo_songs_20261009.py --song one
      - name: Create second independent FULL rock song, empty history again
        env:
          PYTHONPATH: composer/runtime
        run: python research/verify_two_distinct_full_rock_stereo_songs_20261009.py --song two
      - name: Compare note score fingerprints and completed stereo WAV hashes
        run: python research/verify_two_distinct_full_rock_stereo_songs_20261009.py --song compare
      - name: Archive completed audio and short previews for listening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWO_NEW_ROCK_SONGS_ORIGINAL_SFZ_DIRECT_STEREO_20261009
          path: |
            research_artifacts/fresh_rock_real_stereo/one/RESULT.json
            research_artifacts/fresh_rock_real_stereo/one/ROCK_NEW_SONG_ONE_DIRECT_STEREO.wav
            research_artifacts/fresh_rock_real_stereo/one/ROCK_NEW_SONG_ONE_18SEC_PREVIEW.wav
            research_artifacts/fresh_rock_real_stereo/two/RESULT.json
            research_artifacts/fresh_rock_real_stereo/two/ROCK_NEW_SONG_TWO_DIRECT_STEREO.wav
            research_artifacts/fresh_rock_real_stereo/two/ROCK_NEW_SONG_TWO_18SEC_PREVIEW.wav
            research_artifacts/fresh_rock_real_stereo/COMPARISON.json
          retention-days: 30
          if-no-files-found: warn
