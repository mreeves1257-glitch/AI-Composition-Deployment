name: Validate All 55 Musical-Interpreter Genre Filing References
on:
  push:
    branches:
      - genre-interpreter-all-55-20261008
    paths:
      - .github/workflows/verify-all-55-genre-interpreters.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-genre-interpreter-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 13 families and 55 distinct genre Stage-3-to-4 musical intent handoffs without activation
        run: python3 research/validate_all_55_genre_interpreter_references_20261008.py
