name: Instrument Role Performance Profiles Verify

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/instrument-role-performance-profiles-verify.yml"
      - "current_master_forward/instrument_role_performance_profiles.py"
      - "genre_contract_v3_research/verify_instrument_role_performance_profiles.py"
      - "genre_contract_v3_research/ROCK_V3_BASS_ATTACK_HYBRID_HUMAN_DECISION_2026-11-07.json"
      - "current_master_forward/target_registry.json"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify approved role profiles
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_instrument_role_performance_profiles.py
          test -s genre_contract_v3_research/INSTRUMENT_ROLE_PERFORMANCE_PROFILES_VERIFY.json
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: Instrument_Role_Performance_Profiles_Verify
          path: genre_contract_v3_research/INSTRUMENT_ROLE_PERFORMANCE_PROFILES_VERIFY.json
          if-no-files-found: error
