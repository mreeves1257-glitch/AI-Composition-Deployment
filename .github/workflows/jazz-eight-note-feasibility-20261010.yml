name: Jazz Eight Styles Original Source Note Feasibility (No Deploy)
on:
  workflow_dispatch:
  push:
    branches:
      - rock-sfz-preflight-isolated-20261010
    paths:
      - research/jazz_all_styles_recorded_note_feasibility_20261010.py
      - .github/workflows/jazz-eight-note-feasibility-20261010.yml
permissions:
  contents: read
jobs:
  jazz-note-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all eight Jazz style MIDI notes and sources
        env:
          PYTHONPATH: composer/runtime
        run: |
          mkdir -p jazz-source-feasibility
          python research/jazz_all_styles_recorded_note_feasibility_20261010.py > jazz-source-feasibility/execution.log 2>&1 || { cat jazz-source-feasibility/execution.log; exit 1; }
      - name: Preserve detailed note evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazz-eight-source-note-feasibility
          path: jazz-source-feasibility/
