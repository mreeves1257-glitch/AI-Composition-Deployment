    branches: [rock-sfz-preflight-isolated-20261010]
    paths:
      - research/jazz_recorded_source_alias_feasibility_20261010.py
      - .github/workflows/jazz-recorded-source-feasibility-20261010.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/jazz_recorded_source_alias_feasibility_20261010.py
