name: Research Classical V3 Abstract Note Realizer

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - "genre_contract_v3_research/GENRE_CONTRACT_V3_ALL_55.json"
      - "current_master_forward/genre_contract_v3_execution_bridge.py"
      - "current_master_forward/classical_v3_variant_package.py"
      - "current_master_forward/classical_v3_structural_compiler.py"
      - "current_master_forward/classical_v3_note_realizer.py"
      - "genre_contract_v3_research/test_classical_v3_note_realizer.py"
      - ".github/workflows/research-classical-v3-note-realizer.yml"
  workflow_dispatch:

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run abstract note realizer tests
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python -m unittest genre_contract_v3_research/test_classical_v3_note_realizer.py -v

      - name: Export seed-0 abstract note plan and validation summary
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from genre_contract_v3_execution_bridge import snapshot_for
          from classical_v3_variant_package import resolve
          from classical_v3_structural_compiler import compile_plan, validate_plan
          from classical_v3_note_realizer import realize, validate

          out = Path("listening/classical_v3_abstract_notes")
          out.mkdir(parents=True, exist_ok=True)
          package = resolve(snapshot_for("Classical"), "CLASSICAL_PERIOD_ORCHESTRAL")
          structure = compile_plan(
              package, tempo_bpm=112, meter="4/4", mode="quick",
              seed=0, tonic_pc=0, tonal_mode="major")
          validate_plan(structure)
          note_plan = realize(structure)
          summary = validate(note_plan, structure)
          (out / "Classical_V3_Abstract_Note_Plan_seed0.json").write_text(
              json.dumps(note_plan, indent=2) + "\n")
          (out / "Classical_V3_Abstract_Note_Validation_seed0.json").write_text(
              json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload abstract note artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Classical_V3_Abstract_Note_Realizer
          path: listening/classical_v3_abstract_notes/*.json
          if-no-files-found: error
