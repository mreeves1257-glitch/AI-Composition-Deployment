name: Fetch Verified Open Arranger Structures and Test Independent MIDI Exports
on:
  push:
    branches:
      - additional-keyboard-arranger-engines-research-20261009
    paths:
      - .github/workflows/extra-open-keyboard-arrangers-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-arranger-research:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover all previously verified genre references without altering them
        run: python research/validate_all_55_22_capability_procedures_20261009.py
      - name: Pin and preserve open-source chord-following Cadenza arranger source, with license
        run: |
          set -euxo pipefail
          mkdir -p research/EXTERNAL_KEYBOARD_RESEARCH_20261009/01_CADENZA_GPL3
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Piskocis/Cadenza.git research/EXTERNAL_KEYBOARD_RESEARCH_20261009/01_CADENZA_GPL3/source
          cd research/EXTERNAL_KEYBOARD_RESEARCH_20261009/01_CADENZA_GPL3/source
          git sparse-checkout set Source docs tests
          test "$(git rev-parse HEAD)" = "47da8f71670daa4caa1b3db2bf8f60a323f6c6b1"
          test -f LICENSE
          test -f IMPLEMENTED.md
          test -d Source/Arranger
          test -d tests
          git rev-parse HEAD > ../PINNED_GITHUB_COMMIT.txt
          rm -rf .git
          echo 'CADENZA_ARRANGER_SOURCE_COMMIT_AND_LICENSE_PASS'
      - name: Download reusable MIT-licensed Backing Tracks source and test actual Rock/Jazz/Folk MIDI
        run: |
          set -euxo pipefail
          git clone --quiet --depth 1 https://github.com/ako/backing-tracks.git research/EXTERNAL_KEYBOARD_RESEARCH_20261009/02_BACKING_TRACKS_MIT/source
          cd research/EXTERNAL_KEYBOARD_RESEARCH_20261009/02_BACKING_TRACKS_MIT/source
          test "$(git rev-parse HEAD)" = "534b7be0d07595121a9e782c8793244604a1cd41"
          test -f LICENSE
          git rev-parse HEAD > ../PINNED_GITHUB_COMMIT.txt
          go test ./...
          go build -o /tmp/verified-backing-tracks
          mkdir -p ../ISOLATED_SAMPLE_MIDI
          /tmp/verified-backing-tracks export examples/hard-rock-ac.btml ../ISOLATED_SAMPLE_MIDI/ROCK_example.mid
          /tmp/verified-backing-tracks export examples/jazz-swing.btml ../ISOLATED_SAMPLE_MIDI/JAZZ_example.mid
          /tmp/verified-backing-tracks export examples/fingerpick-folk.btml ../ISOLATED_SAMPLE_MIDI/FOLK_example.mid
          test "$(find ../ISOLATED_SAMPLE_MIDI -name '*.mid' -size +300c | wc -l)" -eq 3
          rm -rf .git soundfonts screenshot-player.png
          echo 'BACKING_TRACKS_ORIGINAL_MIT_SOURCE_GO_BUILD_TEST_AND_THREE_GENRE_MIDI_PASS'
      - name: Preserve Impro-Visor standalone GPL2 Java chord style / phrase grammar source only
        run: |
          set -euxo pipefail
          mkdir -p research/EXTERNAL_KEYBOARD_RESEARCH_20261009/03_IMPROVISOR_GPL2
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Impro-Visor/Impro-Visor.git research/EXTERNAL_KEYBOARD_RESEARCH_20261009/03_IMPROVISOR_GPL2/source
          cd research/EXTERNAL_KEYBOARD_RESEARCH_20261009/03_IMPROVISOR_GPL2/source
          git sparse-checkout set src/imp/style src/imp/lickgen src/imp/roadmap src/imp/voicing
          test "$(git rev-parse HEAD)" = "550bbb554962249aceb0e82a72142e3e5b3c0d4a"
          test -f LICENSE.txt
          test -d src/imp/style
          test -d src/imp/lickgen
          git rev-parse HEAD > ../PINNED_GITHUB_COMMIT.txt
          rm -rf .git
          echo 'IMPROVISOR_GPL2_CHORD_STYLE_PHRASE_GRAMMAR_SOURCE_PASS'
      - name: Validate generated MIDI's real independent notes and print pinned research manifest
        run: |
          set -euxo pipefail
          python -m pip install --quiet --disable-pip-version-check mido==1.3.3
          python research/validate_extra_arranger_midi_research_20261009.py
      - name: Include architecture audit, licensing and provenance
        run: |
          set -euxo pipefail
          cp research/KEYBOARD_ARRANGER_SOURCE_ARCHITECTURE_REVIEW_2026-10-09.md research/EXTERNAL_KEYBOARD_RESEARCH_20261009/READ_ME_FIRST_2026-10-09.md
          cp research/validate_extra_arranger_midi_research_20261009.py research/EXTERNAL_KEYBOARD_RESEARCH_20261009/MIDI_AUDIT_SCRIPT.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime
          root=Path("research/EXTERNAL_KEYBOARD_RESEARCH_20261009")
          recs=[]
          for p in root.rglob("*"):
              if p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  recs.append(dict(path=str(p.relative_to(root)),size_bytes=p.stat().st_size,sha256=h))
          manifest=dict(created_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),source_archive_count=3,source_files=len(recs),research_only=True,original_seven_stages_modified=False,original_55_genre_profiles_modified=False,live_composer_modified=False,external_dependencies_installed_in_composer=False,files=recs)
          (root/"SHA256_FILE_MANIFEST_2026-10-09.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("ADDITIONAL_ARRANGER_RESEARCH_SOURCE_CHECKSUM_MANIFEST_PASS",len(recs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXTRA_Cadenza_ImproVisor_BackingTracks_Genre_MIDI_20261009
          path: research/EXTERNAL_KEYBOARD_RESEARCH_20261009/
          if-no-files-found: error
          compression-level: 6
          retention-days: 21
