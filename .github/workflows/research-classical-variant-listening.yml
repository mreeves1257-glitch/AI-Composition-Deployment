name: Research Classical Variant Paired Listening

on:
  workflow_dispatch:
  push:
    branches:
      - genre-contract-v3-research
    paths:
      - "genre_contract_v3_research/classical_variant_validation.py"
      - "genre_contract_v3_research/render_classical_variant_comparison.py"
      - ".github/workflows/research-classical-variant-listening.yml"

jobs:
  render-classical-variant-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supply current-runner copies of pinned Python dependencies
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path
          root = Path("connected_package")
          manifest = json.loads((root / "manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = base64.b64decode((root / part["name"]).read_text(), validate=True)
              assert hashlib.sha256(data).hexdigest() == part["sha256"]
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == manifest["archive_sha256"]
          dest = Path("composer/runtime")
          dest.mkdir(parents=True, exist_ok=True)
          tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz").extractall(dest, filter="data")
          print("REQUIREMENTS_EXTRACTED")
          PY
          python -m pip install -r composer/runtime/enhancer_requirements.txt

      - name: Build preserved Composer runtime and audio dependencies
        run: bash build_current_composer.sh

      - name: Install MP3 converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run structural validation first
        run: python -m unittest genre_contract_v3_research/test_classical_variant_validation.py -v

      - name: Render paired Classical variants
        env:
          PYTHONPATH: ${{ github.workspace }}/genre_contract_v3_research:${{ github.workspace }}/experimental_reasoning:${{ github.workspace }}/current_master_forward:${{ github.workspace }}/composer/runtime
          LD_LIBRARY_PATH: ${{ github.workspace }}/composer/runtime/runtime_linux/lib
          AI_COMP_FLUIDSYNTH_LIBRARY: ${{ github.workspace }}/composer/runtime/runtime_linux/lib/libfluidsynth.so.3
          CLASSICAL_VARIANT_OUT: listening/classical_variant_comparison
          CLASSICAL_VARIANT_SEED: "0"
        run: |
          python genre_contract_v3_research/render_classical_variant_comparison.py
          test -s listening/classical_variant_comparison/Classical_Period_Baseline/Classical_Period_Baseline.mp3
          test -s listening/classical_variant_comparison/Late_Romantic_Expanded/Late_Romantic_Expanded.mp3
          test -s listening/classical_variant_comparison/Classical_Variant_AB_Comparison.mp3
          test -s listening/classical_variant_comparison/pair_validation_summary.json
          cat listening/classical_variant_comparison/pair_validation_summary.json

      - name: Upload paired listening package
        uses: actions/upload-artifact@v4
        with:
          name: Classical_Variant_Paired_Listening
          path: |
            listening/classical_variant_comparison/**/*.mp3
            listening/classical_variant_comparison/**/*.json
            listening/classical_variant_comparison/shared_plan.json
          if-no-files-found: error
          compression-level: 0
