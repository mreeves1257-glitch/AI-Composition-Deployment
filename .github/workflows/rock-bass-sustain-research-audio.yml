name: Isolated Real Rock Bass Sustain A-B (Research Only)
on:
  push:
    branches:
      - performance-language-research-20261008
    paths:
      - .github/workflows/rock-bass-sustain-research-audio.yml
      - research/rock_bass_real_sample_ab_v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rock-bass-sfz-audio-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build preserved recorded Composer in isolated runner, without service deployment
        env:
          AI_COMP_AUTO_PHRASING_V1: "0"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: bash build_current_composer.sh
      - name: Compare same generated Rock bass phrase through real Growlybass SFZ
        env:
          AI_COMP_AUTO_PHRASING_V1: "0"
          PYTHONPATH: composer/runtime
        run: python research/rock_bass_real_sample_ab_v1.py
      - name: Archive original and candidate isolated bass audio for human listening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-bass-real-sfz-original-vs-candidate-20261008
          path: |
            research/rock_bass_ab_output/*.wav
            research/rock_bass_ab_output/*.mid
            research/rock_bass_ab_output/findings.json
          if-no-files-found: warn
          retention-days: 14
