name: Connect Remaining 54 Genre MIDI Identities to Own Interpreters
on:
  push:
    branches: [wire-remaining-54-genres-20261010]
    paths:
      - composer_overrides/genre_styles/genre_owned_midi_inlet.py
      - research/verify_other54_genre_owned_midi_ingress_20261010.py
      - .github/workflows/verify-other54-own-genre-midi-inlets-20261010.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  per-genre-actual-midi-ingress-no-audio-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original MIDI research transport dependency
        run: python -m pip install mido==1.3.3
      - name: Exercise each of the other 54 genre-owned MIDI input connections
        run: python research/verify_other54_genre_owned_midi_ingress_20261010.py
      - name: Archive per-genre actual MIDI connection receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REMAINING_54_ORIGINAL_GENRE_MIDI_INLETS_20261010
          path: research_artifacts/REMAINING_54_MIDI_GENRE_CONNECTIONS.json
          retention-days: 30
          if-no-files-found: warn
