name: 55 Genre Configurations - Real Composer Runtime Regression
on:
  push:
    branches: [configure-activate-all55-genre-routing-20261010]
    paths:
      - .github/workflows/verify-all55-runtime-composer-regression-20261010.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-build-original-recordings-intact:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck all 55 unique original musical configurations and MIDI identities
        run: |
          python -m pip install mido==1.3.3
          python research/verify_all55_active_original_genre_settings_20261010.py
      - name: Build ORIGINAL recorded instrument renderer and all 55 configuration modules
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          AI_COMP_AUTO_PHRASING_V1: '0'
          AI_COMP_ROCK_MELODY_V1: '0'
        run: bash build_current_composer.sh
      - name: Verify actual ORIGINAL Composer can select Rock2 and Jazz Ballad without modifying their instrument sounds
        env:
          PYTHONPATH: composer/runtime
        run: |
          python - <<'PY'
          from genre_styles.genre_run_settings import all_genre_configurations,load_genre_configuration
          from importlib.util import spec_from_file_location,module_from_spec
          from pathlib import Path
          settings=all_genre_configurations()
          assert len(settings)==55
          p=Path('composer/runtime/AI_Comp_Genre_Execution_Adapter_002_WORKING_2026-10-02_184019_CDT.py')
          spec=spec_from_file_location('composer_with_55_connections',p)
          module=module_from_spec(spec)
          spec.loader.exec_module(module)
          adapter=module.GenreExecutionAdapter()
          for i,name in enumerate(('ROCK','Jazz Ballad')):
              r=adapter.resolve(name,mode='normal',creation_seed=20261010+i)
              assert r['status']=='PASS',(name,r.get('reason'),r.get('status'))
              assert len(r['events'])>200,(name,len(r['events']))
              conf=load_genre_configuration(name)
              assert conf['full_recorded_audio_approved_in_isolated_development']
              assert conf['original_own_interpreter']
              print('ORIGINAL_ENGINE_OWN_GENRE_SETTINGS_ACTIVE_PASS',
                    name,len(r['events']),len(conf['all_original_instruments']),flush=True)
          print('REAL_COMPOSER_ALL55_SETTINGS_RUNTIME_ROCK2_AND_JAZZ_PRESERVED_PASS',flush=True)
          PY
