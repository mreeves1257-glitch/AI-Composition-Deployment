name: Inspect Shinyguitar SFZ Preflight

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/inspect-shinyguitar-preflight.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct preserved Composer runtime
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,tarfile
          from pathlib import Path
          root=Path("connected_package")
          manifest=json.loads((root/"manifest.json").read_text())
          archive=bytearray()
          for part in manifest["parts"]:
              data=base64.b64decode((root/part["name"]).read_text(),validate=True)
              assert hashlib.sha256(data).hexdigest()==part["sha256"]
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest()==manifest["archive_sha256"]
          runtime=Path("composer/runtime")
          runtime.mkdir(parents=True,exist_ok=True)
          tarfile.open(fileobj=io.BytesIO(archive),mode="r:gz").extractall(runtime,filter="data")
          print("ISOLATED_RUNTIME_READY")
          PY

      - name: Restore exact pinned Shinyguitar resource
        run: |
          bash genre_contract_v3_research/install_pinned_rock_resource_proof.sh composer/runtime

      - name: Inspect recovered preflight and SFZ path context
        run: |
          echo "=== sfz_renderer_adapter.py ==="
          sed -n '1,240p' composer/runtime/sfz_renderer_adapter.py
          echo "=== composer wrapper ==="
          cat composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Programs/composer_electric.sfz
          echo "=== main.sfz first 160 lines ==="
          sed -n '1,160p' composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Programs/main.sfz
          echo "=== representative sample opcodes ==="
          grep -Rho 'sample=[^[:space:]]*' composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Programs | head -n 30 || true
          echo "=== representative sample paths ==="
          find composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Samples -type f | head -n 30
          echo "=== counts ==="
          printf 'sfz='; find composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Programs -type f -name '*.sfz' | wc -l
          printf 'samples='; find composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Samples -type f | wc -l
          echo "=== SFZ defines ==="
          grep -Rhn '^#define' composer/runtime/sound_resources/KARORYFER_SHINYGUITAR/Programs || true
          echo "=== official compatibility module ==="
          sed -n '1,260p' composer/runtime/official_sfz_compatibility.py
          echo "=== Shinyguitar compatibility assessment ==="
          PYTHONPATH=composer/runtime python - <<'PY'
          from official_sfz_compatibility import assess_production_mapping
          print(assess_production_mapping(
              "KARORYFER_SHINYGUITAR",
              "Programs/composer_electric.sfz",
              backend="external_sfz",
          ))
          PY
