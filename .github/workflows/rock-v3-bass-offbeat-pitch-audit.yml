name: Rock V3 Bass Offbeat Pitch Audit

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-v3-bass-offbeat-pitch-audit.yml"
      - "genre_contract_v3_research/analyze_rock_v3_bass_offbeat_pitch_changes.py"
      - "current_master_forward/rock_v3_bass_downbeat_coherence_candidate.py"
      - "current_master_forward/rock_v3_strum_candidate_executor.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all bass offbeat pitch changes
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/analyze_rock_v3_bass_offbeat_pitch_changes.py
          test -s genre_contract_v3_research/ROCK_V3_BASS_OFFBEAT_PITCH_CHANGE_AUDIT.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: Rock_V3_Bass_Offbeat_Pitch_Audit
          path: genre_contract_v3_research/ROCK_V3_BASS_OFFBEAT_PITCH_CHANGE_AUDIT.json
          if-no-files-found: error
