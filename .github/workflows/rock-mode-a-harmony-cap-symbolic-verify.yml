name: Rock Mode A Harmony Cap Symbolic Verify

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-mode-a-harmony-cap-symbolic-verify.yml"
      - "genre_contract_v3_research/verify_rock_mode_a_harmony_cap_sweep.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify cap candidates symbolically
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_rock_mode_a_harmony_cap_sweep.py
          test -s genre_contract_v3_research/ROCK_MODE_A_HARMONY_CAP_SWEEP_SYMBOLIC_VERIFY.json

      - name: Upload symbolic verification
        uses: actions/upload-artifact@v4
        with:
          name: Rock_Mode_A_Harmony_Cap_Symbolic_Verify
          path: genre_contract_v3_research/ROCK_MODE_A_HARMONY_CAP_SWEEP_SYMBOLIC_VERIFY.json
          if-no-files-found: error
