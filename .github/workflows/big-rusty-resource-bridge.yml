name: Big Rusty resource bridge
on:
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fetch pinned Big Rusty repository
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/sfzinstruments/karoryfer.big-rusty-drums.git big-rusty
          cd big-rusty
          git sparse-checkout init --cone
          git sparse-checkout set Programs Samples
          git checkout f07ce00df34a46b6b08375be56fe116cf15782bc
      - name: Build full-kit proof pack
        run: |
          mkdir -p proof-pack
          cp -a big-rusty/Programs proof-pack/
          cp -a big-rusty/Samples proof-pack/
          printf '%s\n' \
            'Source: sfzinstruments/karoryfer.big-rusty-drums' \
            'Pinned commit: f07ce00df34a46b6b08375be56fe116cf15782bc' \
            'Purpose: AI Composition real-sample drum renderer verification' \
            > proof-pack/PROVENANCE.txt
          find proof-pack -type f | sort > proof-pack/FILELIST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: big-rusty-full-kit-proof-pack
          path: proof-pack
          compression-level: 0
