name: Rock V3 Bass Attack Hybrid Listening

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-v3-bass-attack-hybrid-listening.yml"
      - ".github/actions/setup-pinned-sfizz/action.yml"
      - "genre_contract_v3_research/render_rock_v3_bass_attack_hybrid.py"
      - "genre_contract_v3_research/install_pinned_growlybass_v1002.sh"
      - "current_master_forward/rock_v3_bass_held_tone_candidate.py"
      - "current_master_forward/target_registry.json"
      - "current_master_forward/sfz_renderer_adapter.py"
      - "current_master_forward/official_sfz_compatibility.py"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore exact pinned Growlybass v1.002
        run: |
          bash genre_contract_v3_research/install_pinned_growlybass_v1002.sh current_master_forward

      - name: Validate Clean and Vicious mappings
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python - <<'PY'
          from pathlib import Path
          from sfz_renderer_adapter import validate_sfz_samples
          bank=Path("current_master_forward/sound_resources/KARORYFER_GROWLYBASS_V1_002").resolve()

          clean=validate_sfz_samples(bank/"growlybass_clean.sfz",allowed_root=bank)
          assert clean == {"sample_references":240,"unique_samples":240,"sfz_files_validated":1}, clean

          vicious=validate_sfz_samples(bank/"growlybass_vicious.sfz",allowed_root=bank)
          assert vicious == {"sample_references":86,"unique_samples":86,"sfz_files_validated":1}, vicious

          print("CLEAN",clean)
          print("VICIOUS",vicious)
          PY

      - name: Setup exact pinned sfizz renderer
        id: sfizz
        uses: ./.github/actions/setup-pinned-sfizz

      - name: Render held body and attack layer
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
          AI_COMP_SFIZZ_PIN: "1.2.3@4e70dc0bef53b41f2853ed46e26f5911114c92d0"
          AI_COMP_SFZ_RENDERER: ${{ steps.sfizz.outputs.renderer }}
        run: |
          python genre_contract_v3_research/render_rock_v3_bass_attack_hybrid.py

      - name: Build listening MP3s
        run: |
          set -euo pipefail
          folder="genre_contract_v3_research/rock_v3_bass_attack_hybrid"

          ffmpeg -hide_banner -loglevel error -y             -i "$folder/C_CLEAN_HELD_BASELINE.wav"             -codec:a libmp3lame -b:a 256k             "$folder/C_CLEAN_HELD_BASELINE.mp3"

          ffmpeg -hide_banner -loglevel error -y             -i "$folder/C_CLEAN_HELD_BASELINE.wav"             -i "$folder/VICIOUS_ATTACK_LAYER.wav"             -filter_complex "[0:a]volume=0dB[b];[1:a]volume=-9dB[a];[b][a]amix=inputs=2:duration=longest:normalize=0[m]"             -map "[m]" -codec:a libmp3lame -b:a 256k             "$folder/D_HYBRID_ATTACK_M9.mp3"

          ffmpeg -hide_banner -loglevel error -y             -i "$folder/C_CLEAN_HELD_BASELINE.wav"             -i "$folder/VICIOUS_ATTACK_LAYER.wav"             -filter_complex "[0:a]volume=0dB[b];[1:a]volume=-6dB[a];[b][a]amix=inputs=2:duration=longest:normalize=0[m]"             -map "[m]" -codec:a libmp3lame -b:a 256k             "$folder/E_HYBRID_ATTACK_M6.mp3"

      - name: Validate MP3s
        run: |
          set -euo pipefail
          folder="genre_contract_v3_research/rock_v3_bass_attack_hybrid"
          for f in "$folder"/C_CLEAN_HELD_BASELINE.mp3 "$folder"/D_HYBRID_ATTACK_M9.mp3 "$folder"/E_HYBRID_ATTACK_M6.mp3
          do
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")"
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$f")"
            channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$f")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")"
            python -c 'import sys; d=float(sys.argv[1]); assert d>25; assert sys.argv[2]=="mp3"; assert int(sys.argv[3])==44100; assert int(sys.argv[4])==2; print("VALID",sys.argv[5],d)' "$duration" "$codec" "$rate" "$channels" "$f"
          done

      - name: Upload bass attack hybrid listening package
        uses: actions/upload-artifact@v4
        with:
          name: Rock_V3_Bass_Attack_Hybrid_Listening
          path: |
            genre_contract_v3_research/rock_v3_bass_attack_hybrid/C_CLEAN_HELD_BASELINE.mp3
            genre_contract_v3_research/rock_v3_bass_attack_hybrid/D_HYBRID_ATTACK_M9.mp3
            genre_contract_v3_research/rock_v3_bass_attack_hybrid/E_HYBRID_ATTACK_M6.mp3
            genre_contract_v3_research/rock_v3_bass_attack_hybrid/ROCK_V3_BASS_ATTACK_HYBRID_REPORT.json
          if-no-files-found: error
