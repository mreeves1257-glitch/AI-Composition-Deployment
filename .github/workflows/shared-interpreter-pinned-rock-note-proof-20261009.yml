name: Pinned MMA Rock — REAL Score Interpreter through ONE Shared 55-Genre Boundary
on:
  push:
    branches: [shared-interpreter-rock-executable-20261009]
    paths:
      - .github/workflows/shared-interpreter-pinned-rock-note-proof-20261009.yml
      - composer_overrides/genre_styles/shared_interpreter_router.py
      - composer_overrides/genre_styles/Rock/rock_pinned_mma_interpreter.py
      - research/test_pinned_mma_shared_interpreter_execution_20261009.py
      - research/test_rock_guitar_strum_score_20261009.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prove-real-musical-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get EXACT preserved user-liked MMA 16-bar MIDI from Oct 8 successful original audio workflow
        uses: actions/download-artifact@v4
        with:
          name: official-mma-16bar-rock-arranger-to-original-recorded-instruments-r1-20261008
          run-id: 37870594722
          repository: mreeves1257-glitch/AI-Composition-Deployment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/pinned_input
      - name: Install independent MIDI reader
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Verify all 55 original genre routes have the 22 requirements and unchanged stage ownership
        run: |
          python research/test_shared_interpreter_router_all55_20261009.py
          python research/validate_all_55_22_capability_procedures_20261009.py
      - name: Execute Rock Stage-3-to-4 backend and compare EVERY note against October 8 exact original
        run: python research/test_pinned_mma_shared_interpreter_execution_20261009.py
      - name: Verify separate Rock rhythm-guitar strum performance alters no other role or note pitches
        run: python research/test_rock_guitar_strum_score_20261009.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SHARED_INTERPRETER_ROCK_PINNED_420_NOTE_SCORE_PROOF_20261009
          path: |
            research/pinned_shared_interpreter_rock_output/
          if-no-files-found: warn
          retention-days: 21
