name: Rock Mode A Role Isolated Listening

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-mode-a-role-isolated-listening.yml"
      - "genre_contract_v3_research/render_rock_mode_a_guitar_ab.py"
      - "genre_contract_v3_research/install_pinned_rock_resource_proof.sh"
      - "current_master_forward/rock_v3_core_development_executor.py"
      - "current_master_forward/rock_v3_core_performance_executor.py"
      - "current_master_forward/rock_v3_core_performance_plan.py"
      - "current_master_forward/target_registry.json"
      - "current_master_forward/sfz_renderer_adapter.py"
      - "current_master_forward/official_sfz_compatibility.py"
  workflow_dispatch:

jobs:
  role-isolated-listening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python and audio dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Restore exact pinned Shinyguitar resource
        run: |
          bash genre_contract_v3_research/install_pinned_rock_resource_proof.sh current_master_forward
          test "$(sha256sum current_master_forward/sound_resources/KARORYFER_SHINYGUITAR/Programs/composer_electric.sfz | awk '{print $1}')" = "da026ba66ab34a4ebb99c6cda93a24d4bc48e57e252a26db5c1fd6916cbaed35"

      - name: Prove Shinyguitar sample graph
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python - <<'PY'
          from pathlib import Path
          from sfz_renderer_adapter import validate_sfz_samples
          pack=Path("current_master_forward/sound_resources/KARORYFER_SHINYGUITAR").resolve()
          report=validate_sfz_samples(pack/"Programs/composer_electric.sfz",allowed_root=pack)
          assert report == {
              "sample_references":6798,
              "unique_samples":846,
              "sfz_files_validated":16,
          }, report
          print(report)
          PY

      - name: Build pinned sfizz 1.2.3 offline renderer
        run: |
          set -euo pipefail
          rm -rf /tmp/sfizz /tmp/sfizz-build
          git clone --recursive https://github.com/sfztools/sfizz.git /tmp/sfizz
          cd /tmp/sfizz
          git checkout 4e70dc0bef53b41f2853ed46e26f5911114c92d0
          git submodule update --init --recursive
          cmake -S /tmp/sfizz -B /tmp/sfizz-build             -DCMAKE_BUILD_TYPE=Release             -DENABLE_LTO=OFF             -DSFIZZ_JACK=OFF             -DSFIZZ_SHARED=OFF             -DSFIZZ_RENDER=ON             -DSFIZZ_TESTS=OFF             -DSFIZZ_DEMOS=OFF             -DSFIZZ_DEVTOOLS=OFF
          cmake --build /tmp/sfizz-build --target sfizz_render --parallel 2
          RENDERER="$(find /tmp/sfizz-build -type f -name sfizz_render -perm -111 | head -n 1)"
          test -n "$RENDERER"
          printf '%s\n' "$RENDERER" > /tmp/sfizz-renderer-path

      - name: Render exact same Rock Mode A A/B stems
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
          AI_COMP_SFIZZ_PIN: "1.2.3@4e70dc0bef53b41f2853ed46e26f5911114c92d0"
        run: |
          export AI_COMP_SFZ_RENDERER="$(cat /tmp/sfizz-renderer-path)"
          python genre_contract_v3_research/render_rock_mode_a_guitar_ab.py

      - name: Encode isolated HARMONY and LEAD stem MP3s
        run: |
          set -euo pipefail
          folder="genre_contract_v3_research/rock_mode_a_guitar_ab"
          for stem in \
            A_BEFORE_MODE_A_HARMONY \
            B_AFTER_MODE_A_HARMONY \
            A_BEFORE_MODE_A_LEAD \
            B_AFTER_MODE_A_LEAD
          do
            ffmpeg -hide_banner -loglevel error -y \
              -i "$folder/$stem.wav" \
              -codec:a libmp3lame -b:a 256k \
              "$folder/$stem.mp3"
            test -s "$folder/$stem.mp3"
          done

      - name: Create focused 8-bar rhythm-guitar intro excerpts
        run: |
          set -euo pipefail
          folder="genre_contract_v3_research/rock_mode_a_guitar_ab"
          seconds="$(python - <<'PY'
          print(8*4*60/123)
          PY
          )"
          for stem in A_BEFORE_MODE_A_HARMONY B_AFTER_MODE_A_HARMONY
          do
            ffmpeg -hide_banner -loglevel error -y \
              -t "$seconds" \
              -i "$folder/$stem.wav" \
              -codec:a libmp3lame -b:a 256k \
              "$folder/${stem}_INTRO_8BAR.mp3"
            test -s "$folder/${stem}_INTRO_8BAR.mp3"
          done

      - name: Validate every listening MP3 with ffprobe
        run: |
          set -euo pipefail
          folder="genre_contract_v3_research/rock_mode_a_guitar_ab"
          for f in \
            "$folder/A_BEFORE_MODE_A_HARMONY.mp3" \
            "$folder/B_AFTER_MODE_A_HARMONY.mp3" \
            "$folder/A_BEFORE_MODE_A_LEAD.mp3" \
            "$folder/B_AFTER_MODE_A_LEAD.mp3" \
            "$folder/A_BEFORE_MODE_A_HARMONY_INTRO_8BAR.mp3" \
            "$folder/B_AFTER_MODE_A_HARMONY_INTRO_8BAR.mp3"
          do
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")"
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")"
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$f")"
            channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$f")"
            python - <<PY
d=float("$duration")
assert d>1.0, ("DURATION_TOO_SHORT","$f",d)
assert "$codec"=="mp3", ("CODEC","$f","$codec")
assert int("$rate")==44100, ("RATE","$f","$rate")
assert int("$channels")==2, ("CHANNELS","$f","$channels")
print("VALID_MP3","$f",d)
PY
          done

      - name: Write role-isolation manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path("genre_contract_v3_research/rock_mode_a_guitar_ab")
          manifest={
              "schema":"ROCK_MODE_A_ROLE_ISOLATED_LISTENING_001",
              "status":"PASS",
              "diagnostic_only":True,
              "source_comparison":"ROCK_MODE_A_GUITAR_AB_LISTENING_001",
              "performance_mode":"A_GUITAR_DURATION_ONLY",
              "same_symbolic_A_B":True,
              "only_difference_between_A_B":"ELECTRIC_GUITAR_NOTE_DURATIONS",
              "role_pairs":{
                  "HARMONY":[
                      "A_BEFORE_MODE_A_HARMONY.mp3",
                      "B_AFTER_MODE_A_HARMONY.mp3"
                  ],
                  "LEAD":[
                      "A_BEFORE_MODE_A_LEAD.mp3",
                      "B_AFTER_MODE_A_LEAD.mp3"
                  ],
                  "HARMONY_INTRO_8BAR":[
                      "A_BEFORE_MODE_A_HARMONY_INTRO_8BAR.mp3",
                      "B_AFTER_MODE_A_HARMONY_INTRO_8BAR.mp3"
                  ]
              },
              "reasoning_engine_used":False,
              "new_performance_variable_added":False,
              "production_fidelity_certified":False,
              "listening_approval":False,
              "live_runtime_promoted":False,
              "listening_questions":{
                  "HARMONY":"Does B sound like natural guitar ring, or does 0.5->2.8 beat sustain make the rhythm guitar pad-like/smeared?",
                  "LEAD":"Do the small B duration extensions make phrases more connected without losing rests or articulation?",
                  "HARMONY_INTRO_8BAR":"Focused check of the largest recurring rhythm-guitar sustain change."
              },
              "next_gate":"HUMAN_ROLE_ISOLATED_A_B_REVIEW__NO_NEW_PERFORMANCE_VARIABLE"
          }
          (folder/"ROCK_MODE_A_ROLE_ISOLATED_LISTENING_MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload role-isolated listening package
        uses: actions/upload-artifact@v4
        with:
          name: Rock_Mode_A_Role_Isolated_Listening
          path: |
            genre_contract_v3_research/rock_mode_a_guitar_ab/A_BEFORE_MODE_A_HARMONY.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/B_AFTER_MODE_A_HARMONY.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/A_BEFORE_MODE_A_LEAD.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/B_AFTER_MODE_A_LEAD.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/A_BEFORE_MODE_A_HARMONY_INTRO_8BAR.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/B_AFTER_MODE_A_HARMONY_INTRO_8BAR.mp3
            genre_contract_v3_research/rock_mode_a_guitar_ab/ROCK_MODE_A_ROLE_ISOLATED_LISTENING_MANIFEST.json
          if-no-files-found: error
