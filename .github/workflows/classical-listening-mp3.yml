name: Classical Reasoning Listening MP3

on:
  push:
    branches:
      - composer-reasoning-engine-v0-1
    paths:
      - ".github/workflows/classical-listening-mp3.yml"
      - "experimental_reasoning/render_classical_reasoning_real_harmony_v0_1.py"
      - "experimental_reasoning/classical_reasoning_bridge_v0_1.py"
      - "experimental_reasoning/reasoning_engine_v0_1.py"
  workflow_dispatch:

jobs:
  render-classical-reasoning-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supply current-runner copies of pinned Python dependencies
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path
          root = Path("connected_package")
          manifest = json.loads((root / "manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = base64.b64decode((root / part["name"]).read_text(), validate=True)
              assert hashlib.sha256(data).hexdigest() == part["sha256"]
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == manifest["archive_sha256"]
          dest = Path("composer/runtime")
          dest.mkdir(parents=True, exist_ok=True)
          tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz").extractall(dest, filter="data")
          print("REQUIREMENTS_EXTRACTED")
          PY
          python -m pip install -r composer/runtime/enhancer_requirements.txt

      - name: Build preserved Composer runtime and audio dependencies
        run: bash build_current_composer.sh

      - name: Install MP3 converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render real-harmony Classical reasoning audition
        env:
          PYTHONPATH: ${{ github.workspace }}/experimental_reasoning:${{ github.workspace }}/current_master_forward:${{ github.workspace }}/composer/runtime
          LD_LIBRARY_PATH: ${{ github.workspace }}/composer/runtime/runtime_linux/lib
          AI_COMP_FLUIDSYNTH_LIBRARY: ${{ github.workspace }}/composer/runtime/runtime_linux/lib/libfluidsynth.so.3
          CLASSICAL_REASONING_OUT: listening/reasoning_real_classical
        run: |
          python experimental_reasoning/render_classical_reasoning_real_harmony_v0_1.py
          test -s listening/reasoning_real_classical/Classical_Reasoning_v01_RealHarmony.mp3
          test -s listening/reasoning_real_classical/validation_summary.json
          cat listening/reasoning_real_classical/validation_summary.json

      - name: Upload MP3 and validation
        uses: actions/upload-artifact@v4
        with:
          name: Classical_Reasoning_v01_RealHarmony
          path: |
            listening/reasoning_real_classical/Classical_Reasoning_v01_RealHarmony.mp3
            listening/reasoning_real_classical/validation_summary.json
          if-no-files-found: error
          compression-level: 0
