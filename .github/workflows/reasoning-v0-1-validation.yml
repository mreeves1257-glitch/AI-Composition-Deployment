name: Reasoning Engine v0.1 Validation

on:
  push:
    branches:
      - composer-reasoning-engine-v0-1
    paths:
      - "experimental_reasoning/**"
      - ".github/workflows/reasoning-v0-1-validation.yml"
  workflow_dispatch:

jobs:
  reasoning-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reasoning engine tests
        working-directory: experimental_reasoning
        run: python test_reasoning_engine_v0_1.py
      - name: Run Classical bridge tests
        working-directory: experimental_reasoning
        run: python test_classical_reasoning_bridge_v0_1.py
