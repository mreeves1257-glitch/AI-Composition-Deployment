name: Execute Original Authored MMA Swing Grooves - Two New MIDI Songs
on:
  push:
    branches: [swing-original-mma-execution-proof-20261010]
    paths:
      - research/verify_original_mma_swing_2_new_songs_20261010.py
      - .github/workflows/verify-original-mma-swing-grooves-20261010.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-interpreter-source-does-actual-music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve all 55 genre source catalog identities and 23 original style files
        run: python research/verify_all55_published_style_archive_20261010.py
      - name: Install MIDI inspection package
        run: python -m pip install mido==1.3.3
      - name: Retrieve unmodified ORIGINAL MMA interpreter at pinned source revision
        run: |
          git clone --quiet https://github.com/infojunkie/mma.git "$RUNNER_TEMP/original_mma_upstream"
          git -C "$RUNNER_TEMP/original_mma_upstream" checkout --quiet c52943c31aa1e64fa9b5313620d5065f91c22773
          git -C "$RUNNER_TEMP/original_mma_upstream" rev-parse HEAD
      - name: Execute published Swing intro/walking bass/variations/fill/ending for TWO different songs
        run: python research/verify_original_mma_swing_2_new_songs_20261010.py "$RUNNER_TEMP/original_mma_upstream"
      - name: Archive source-preserving executable groove MIDI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINAL_MMA_SWING_TWO_INDEPENDENT_SONGS_MIDI_20261010
          path: research_artifacts/original_mma_swing_executable_20261010/
          if-no-files-found: warn
          retention-days: 30
