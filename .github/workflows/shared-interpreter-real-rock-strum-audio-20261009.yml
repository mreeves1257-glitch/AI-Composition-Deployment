name: Shared Interpreter Rock — Pinned Real-Recorded Guitar Strum A/B (No Deploy)
on:
  push:
    branches:
      - shared-interpreter-rock-executable-20261009
    paths:
      - .github/workflows/shared-interpreter-real-rock-strum-audio-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-pinned-score-with-one-human-guitar-performance-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover immutable user-liked October 8 original Rock MIDI artifact
        uses: actions/download-artifact@v4
        with:
          name: official-mma-16bar-rock-arranger-to-original-recorded-instruments-r1-20261008
          run-id: 37870594722
          repository: mreeves1257-glitch/AI-Composition-Deployment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/pinned_input
      - name: Install original research proof MIDI dependency only
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Restore preserved actual Composer, sfizz renderer and exact live recorded Karoryfer sources in isolation
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          AI_COMP_ROCK_MELODY_V1: '0'
          AI_COMP_AUTO_PHRASING_V1: '0'
          AI_COMP_ROCK_BASS_SUSTAIN_V1: '0'
        run: bash build_current_composer.sh
      - name: Re-verify the 55 shared Stage3 to Stage4 file connections and Rock pinned MIDI data
        run: |
          python research/test_shared_interpreter_router_all55_20261009.py
          python research/test_pinned_mma_shared_interpreter_execution_20261009.py
      - name: Reproduce original user-liked real recording and -8 dB mix and render new guitar-only strum A/B
        env:
          PYTHONPATH: composer/runtime
        run: python research/rock_shared_interpreter_strum_3d_ab_20261009.py
      - name: Save original-vs-one-variable human guitar rhythm audio from same existing recorded instruments and unchanged mixer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pinned_55_Shared_Interpreter_Rock_GuitarStrum_RealSFZ_3D_AB_20261009
          path: |
            research/shared_rock_strum_audio_r1/REFERENCE_20261008_UNCHANGED_BassMinus8_Original3D.wav
            research/shared_rock_strum_audio_r1/GUITAR_ATTACK_STRUM_ONLY_BassMinus8_Original3D.wav
            research/shared_rock_strum_audio_r1/PROOF_AND_STRUM_AB_REPORT.json
            research/pinned_shared_interpreter_rock_output/CHECKSUM_AND_STATUS.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 21
