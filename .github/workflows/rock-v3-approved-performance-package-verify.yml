name: Rock V3 Approved Performance Package Verify

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - ".github/workflows/rock-v3-approved-performance-package-verify.yml"
      - "current_master_forward/instrument_role_performance_profiles.py"
      - "current_master_forward/rock_v3_approved_performance_package.py"
      - "current_master_forward/rock_v3_core_performance_plan.py"
      - "current_master_forward/rock_v3_bass_held_tone_candidate.py"
      - "current_master_forward/rock_v3_bass_offbeat_coherence_candidate.py"
      - "current_master_forward/rock_v3_strum_candidate_executor.py"
      - "genre_contract_v3_research/verify_rock_v3_approved_performance_package.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify approved Rock performance package
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python genre_contract_v3_research/verify_rock_v3_approved_performance_package.py
          test -s genre_contract_v3_research/ROCK_V3_APPROVED_PERFORMANCE_PACKAGE_VERIFY.json
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: Rock_V3_Approved_Performance_Package_Verify
          path: genre_contract_v3_research/ROCK_V3_APPROVED_PERFORMANCE_PACKAGE_VERIFY.json
          if-no-files-found: error
