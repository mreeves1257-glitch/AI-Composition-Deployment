name: Research Classical Combined Composition Listening

on:
  push:
    branches:
      - genre-contract-v3-research
    paths:
      - "genre_contract_v3_research/render_classical_combined_composition.py"
      - "genre_contract_v3_research/classical_melody_grammar_binding_validation.py"
      - "genre_contract_v3_research/classical_voice_leading_validation.py"
      - "genre_contract_v3_research/test_classical_melody_grammar_binding_validation.py"
      - ".github/workflows/research-classical-combined-composition.yml"
  workflow_dispatch:

jobs:
  render-combined-classical-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supply current-runner copies of pinned Python dependencies
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path
          root = Path("connected_package")
          manifest = json.loads((root / "manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = base64.b64decode((root / part["name"]).read_text(), validate=True)
              assert hashlib.sha256(data).hexdigest() == part["sha256"]
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == manifest["archive_sha256"]
          dest = Path("composer/runtime")
          dest.mkdir(parents=True, exist_ok=True)
          tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz").extractall(dest, filter="data")
          print("REQUIREMENTS_EXTRACTED")
          PY
          python -m pip install -r composer/runtime/enhancer_requirements.txt

      - name: Build preserved Composer runtime and audio dependencies
        run: bash build_current_composer.sh

      - name: Install MP3 converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Re-run melody-to-grammar structural gate
        run: |
          python -m unittest genre_contract_v3_research/test_classical_melody_grammar_binding_validation.py -v

      - name: Render combined Classical and Romantic composition auditions
        env:
          PYTHONPATH: ${{ github.workspace }}/genre_contract_v3_research:${{ github.workspace }}/composer/runtime
          LD_LIBRARY_PATH: ${{ github.workspace }}/composer/runtime/runtime_linux/lib
          AI_COMP_FLUIDSYNTH_LIBRARY: ${{ github.workspace }}/composer/runtime/runtime_linux/lib/libfluidsynth.so.3
          CLASSICAL_COMBINED_OUT: listening/classical_combined_composition
          CLASSICAL_COMBINED_SEED: "0"
        run: |
          python genre_contract_v3_research/render_classical_combined_composition.py
          test -s listening/classical_combined_composition/CLASSICAL_PERIOD_COMBINED/CLASSICAL_PERIOD_COMBINED_Listening.mp3
          test -s listening/classical_combined_composition/ROMANTIC_TONAL_COMBINED/ROMANTIC_TONAL_COMBINED_Listening.mp3
          test -s listening/classical_combined_composition/Classical_vs_Romantic_Combined_Grammar_Melody_AB.mp3
          test -s listening/classical_combined_composition/pair_validation_summary.json
          cat listening/classical_combined_composition/pair_validation_summary.json

      - name: Upload reproducible combined listening package
        uses: actions/upload-artifact@v4
        with:
          name: Classical_Combined_Grammar_Melody_Listening
          path: |
            listening/classical_combined_composition/**/*.mp3
            listening/classical_combined_composition/**/*.json
            listening/classical_combined_composition/**/*.mid
          if-no-files-found: error
          compression-level: 0
