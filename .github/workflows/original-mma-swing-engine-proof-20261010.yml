name: Original Published MMA Swing Engine - Actual MIDI Proof
on:
  push:
    branches: [swing-official-mma-engine-proof-20261010]
    paths:
      - .github/workflows/original-mma-swing-engine-proof-20261010.yml
      - research/test_original_mma_swing_engine_20261010.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-swing-accompaniment-executes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout our archived music-style instructions
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout immutable ORIGINAL GPL MMA engine and groove library
        uses: actions/checkout@v4
        with:
          repository: infojunkie/mma
          ref: c52943c31aa1e64fa9b5313620d5065f91c22773
          path: original_mma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MIDI parser, not an alternate arranger or synthesizer
        run: python -m pip install mido==1.3.3
      - name: Index original MMA standard library
        working-directory: original_mma
        run: python mma.py -g
      - name: Run real SwingIntro SwingWalk Swing1Walk SwingFill Swing2 SwingEnd, generate original MIDI
        run: python project/research/test_original_mma_swing_engine_20261010.py original_mma
      - name: Preserve real MMA accompaniment MIDI, chord chart and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINAL_MMA_SWING_ENGINE_28BAR_GENERATED_MIDI_20261010
          path: |
            project/research_artifacts/swing_mma_original_engine/RESULT.json
            project/research_artifacts/swing_mma_original_engine/swing_original_mma_28bar_score.mma
            project/research_artifacts/swing_mma_original_engine/swing_original_mma_28bar_accompaniment.mid
          retention-days: 30
          if-no-files-found: warn
