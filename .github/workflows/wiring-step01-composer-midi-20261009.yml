name: Wiring Step 01 - Original Composer to MIDI (No Deploy)
on:
  push:
    branches: [wiring-step01-composer-midi-20261009]
    paths:
      - research/verify_composer_to_midi_wiring_step01_20261009.py
      - .github/workflows/wiring-step01-composer-midi-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-composer-midi-first-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MIDI validator (not a music synthesizer)
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Original composer produces genuine multitrack MIDI
        run: python research/verify_composer_to_midi_wiring_step01_20261009.py
      - name: Confirm hard-copy wiring order and no shared interpreter activation
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("research/verify_composer_to_midi_wiring_step01_20261009.py").read_text()
          assert "genre_styles.shared_interpreter_router" not in source
          assert "shared_interpreter_router" not in source
          assert "GENRE_OWNED" not in source
          assert "build_current_composer.sh" not in source
          print("STEP01_ORIGINAL_COMPONENT_ONLY_NO_NEW_INTERPRETER_PASS")
          PY
