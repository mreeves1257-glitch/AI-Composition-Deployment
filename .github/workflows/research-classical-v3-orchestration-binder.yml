name: Research Classical V3 Canonical Orchestration

on:
  push:
    branches:
      - genre-contract-v3-no-reasoning-diagnostic
    paths:
      - "genre_contract_v3_research/GENRE_CONTRACT_V3_ALL_55.json"
      - "current_master_forward/genre_contract_v3_execution_bridge.py"
      - "current_master_forward/classical_v3_variant_package.py"
      - "current_master_forward/classical_v3_structural_compiler.py"
      - "current_master_forward/classical_v3_note_realizer.py"
      - "current_master_forward/classical_v3_orchestration_binder.py"
      - "genre_contract_v3_research/test_classical_v3_orchestration_binder.py"
      - ".github/workflows/research-classical-v3-orchestration-binder.yml"
  workflow_dispatch:

jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run canonical orchestration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python -m unittest genre_contract_v3_research/test_classical_v3_orchestration_binder.py -v

      - name: Export seed-0 orchestration plan and validation
        env:
          PYTHONPATH: ${{ github.workspace }}/current_master_forward
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from genre_contract_v3_execution_bridge import snapshot_for
          from classical_v3_variant_package import resolve
          from classical_v3_structural_compiler import compile_plan, validate_plan
          from classical_v3_note_realizer import realize as realize_notes, validate as validate_notes
          from classical_v3_orchestration_binder import bind, validate

          out = Path("listening/classical_v3_orchestration")
          out.mkdir(parents=True, exist_ok=True)
          package = resolve(snapshot_for("Classical"), "CLASSICAL_PERIOD_ORCHESTRAL")
          structure = compile_plan(
              package, tempo_bpm=112, meter="4/4", mode="quick",
              seed=0, tonic_pc=0, tonal_mode="major")
          validate_plan(structure)
          notes = realize_notes(structure)
          validate_notes(notes, structure)
          orchestration = bind(notes, structure, package)
          summary = validate(orchestration, notes, structure)
          (out / "Classical_V3_Canonical_Orchestration_seed0.json").write_text(
              json.dumps(orchestration, indent=2) + "\n")
          (out / "Classical_V3_Canonical_Orchestration_Validation_seed0.json").write_text(
              json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload canonical orchestration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Classical_V3_Canonical_Orchestration
          path: listening/classical_v3_orchestration/*.json
          if-no-files-found: error
