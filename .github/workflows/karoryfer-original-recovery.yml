name: Karoryfer Original Release Recovery

on:
  push:
    branches:
      - karoryfer-original-recovery-2026-10-12
    paths:
      - .github/workflows/karoryfer-original-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          curl -L --fail --retry 5 --retry-delay 2 --output recovery/Karoryfer.Shinyguitar.v1.002.zip \
            https://github.com/sfzinstruments/karoryfer.shinyguitar/releases/download/v1.002/Karoryfer.Shinyguitar.v1.002.zip
          curl -L --fail --retry 5 --retry-delay 2 --output recovery/Big_Rusty_Drums_1100.zip \
            https://github.com/sfzinstruments/karoryfer.big-rusty-drums/releases/download/v1.100/Big_Rusty_Drums_1100.zip

      - name: Verify and split Big Rusty Drums
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s recovery/Karoryfer.Shinyguitar.v1.002.zip)" = "368411844"
          test "$(stat -c%s recovery/Big_Rusty_Drums_1100.zip)" = "619600370"
          unzip -tqq recovery/Karoryfer.Shinyguitar.v1.002.zip
          unzip -tqq recovery/Big_Rusty_Drums_1100.zip
          sha256sum recovery/Karoryfer.Shinyguitar.v1.002.zip recovery/Big_Rusty_Drums_1100.zip | tee recovery/SHA256SUMS.txt
          {
            echo "Shinyguitar_bytes=$(stat -c%s recovery/Karoryfer.Shinyguitar.v1.002.zip)"
            echo "Big_Rusty_Drums_bytes=$(stat -c%s recovery/Big_Rusty_Drums_1100.zip)"
          } > recovery/VERIFIED_SIZES.txt
          split -b 300000000 -d -a 3 --additional-suffix=.bin recovery/Big_Rusty_Drums_1100.zip recovery/Big_Rusty_Drums_1100.zip.part.
          sha256sum recovery/Big_Rusty_Drums_1100.zip.part.*.bin > recovery/BIG_RUSTY_PART_SHA256SUMS.txt

      - name: Upload Shinyguitar
        uses: actions/upload-artifact@v4
        with:
          name: karoryfer-shinyguitar-v1-002-original-run2
          path: |
            recovery/Karoryfer.Shinyguitar.v1.002.zip
            recovery/SHA256SUMS.txt
            recovery/VERIFIED_SIZES.txt
          compression-level: 0
          retention-days: 1

      - name: Upload Big Rusty part 000
        uses: actions/upload-artifact@v4
        with:
          name: big-rusty-original-part-000
          path: recovery/Big_Rusty_Drums_1100.zip.part.000.bin
          compression-level: 0
          retention-days: 1

      - name: Upload Big Rusty part 001
        uses: actions/upload-artifact@v4
        with:
          name: big-rusty-original-part-001
          path: recovery/Big_Rusty_Drums_1100.zip.part.001.bin
          compression-level: 0
          retention-days: 1

      - name: Upload Big Rusty part 002
        uses: actions/upload-artifact@v4
        with:
          name: big-rusty-original-part-002
          path: recovery/Big_Rusty_Drums_1100.zip.part.002.bin
          compression-level: 0
          retention-days: 1

      - name: Upload Big Rusty verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: big-rusty-original-verification
          path: |
            recovery/SHA256SUMS.txt
            recovery/VERIFIED_SIZES.txt
            recovery/BIG_RUSTY_PART_SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
