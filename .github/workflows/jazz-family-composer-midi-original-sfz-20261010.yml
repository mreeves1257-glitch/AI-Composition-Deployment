name: Jazz Family Actual Composer MIDI To Original SFZ Stereo
on:
  push:
    branches: [jazz-family-midi-to-instruments-20261010]
    paths:
      - .github/workflows/jazz-family-composer-midi-original-sfz-20261010.yml
      - composer_overrides/genre_styles/Jazz/composer_midi_handoff.py
      - build_current_composer.sh
      - research/verify_jazz_family_real_audio_connection_20261010.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jazz-ballad-genre-midi-real-six-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm all eight Jazz genre-owned MIDI inlets registered
        run: |
          python -m pip install mido==1.3.3
          python research/verify_other54_genre_owned_midi_ingress_20261010.py
      - name: Build existing Composer renderer with Jazz pre-SFZ MIDI handoff
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          AI_COMP_AUTO_PHRASING_V1: '0'
          AI_COMP_ROCK_MELODY_V1: '0'
        run: bash build_current_composer.sh
      - name: Actual Jazz Ballad Composer MIDI through Jazz-specific interpreter and six original sampled instruments
        env:
          PYTHONPATH: composer/runtime
        run: python research/verify_jazz_family_real_audio_connection_20261010.py
      - name: Keep full Jazz WAV and Jazz MIDI handoff proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAZZ_BALLAD_ACTUAL_COMPOSER_MIDI_OWN_SFZ_STEREO_20261010
          path: |
            research_artifacts/jazz_family_connected_audio_20261010/RESULT.json
            research_artifacts/jazz_family_connected_audio_20261010/JAZZ_BALLAD_COMPOSER_MIDI_ORIGINAL_INSTRUMENTS_STEREO.wav
            research_artifacts/jazz_family_connected_audio_20261010/original_recorded_audio_output/jazz_genre_midi_handoffs
          if-no-files-found: warn
          retention-days: 30
